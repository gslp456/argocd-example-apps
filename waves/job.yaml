apiVersion: batch/v1
kind: Job
metadata:
  name: waves-verify
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  template:
    backoffLimit: 0
    spec:
      containers:
        - name: waves-verify
          image: alpine:3.20
          command: ["sleep", "2"]
      restartPolicy: Never  
